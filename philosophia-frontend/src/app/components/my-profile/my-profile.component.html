<div class="max-w-lg mx-auto bg-white border border-stone-200 rounded-xl shadow-sm p-8">
  <h2 class="text-2xl font-serif text-stone-800 mb-6">Mon profil</h2>

  <div *ngIf="!profile" class="text-stone-500 text-sm">
    Aucune information de profil disponible.
  </div>

  <div *ngIf="profile" class="space-y-4">
    <div>
      <label class="text-xs uppercase tracking-wide text-stone-500">Nom d'utilisateur</label>
      <p class="mt-1 text-stone-800">{{ profile.username }}</p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs uppercase tracking-wide text-stone-500">Prénom</label>
        <input
          [(ngModel)]="form.firstName"
          [disabled]="!editMode"
          type="text"
          class="w-full mt-1 border border-stone-300 rounded-lg px-3 py-2 disabled:bg-stone-50 disabled:text-stone-500"
        />
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-stone-500">Nom</label>
        <input
          [(ngModel)]="form.lastName"
          [disabled]="!editMode"
          type="text"
          class="w-full mt-1 border border-stone-300 rounded-lg px-3 py-2 disabled:bg-stone-50 disabled:text-stone-500"
        />
      </div>
    </div>

    <div>
      <label class="text-xs uppercase tracking-wide text-stone-500">Téléphone</label>
      <input
        [(ngModel)]="form.phone"
        [disabled]="!editMode"
        type="text"
        class="w-full mt-1 border border-stone-300 rounded-lg px-3 py-2 disabled:bg-stone-50 disabled:text-stone-500"
      />
    </div>

    <div>
      <label class="text-xs uppercase tracking-wide text-stone-500">Établissement</label>
      <input
        [(ngModel)]="form.institute"
        [disabled]="!editMode"
        type="text"
        class="w-full mt-1 border border-stone-300 rounded-lg px-3 py-2 disabled:bg-stone-50 disabled:text-stone-500"
      />
    </div>

    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-stone-200">
      <div>
        <label class="text-xs uppercase tracking-wide text-stone-500">Section</label>
        <p class="mt-1 text-stone-600">{{ profile.section || '—' }}</p>
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-stone-500">Séances impayées</label>
        <p class="mt-1 text-stone-600">{{ profile.unpaidSession }}</p>
      </div>
    </div>

    <p *ngIf="errorMessage" class="text-sm text-red-500">{{ errorMessage }}</p>

    <div class="flex gap-3 pt-4">
      <button
        *ngIf="!editMode"
        (click)="enableEdit()"
        class="flex-1 bg-slate-800 hover:bg-slate-700 text-stone-100 rounded-lg py-2.5"
      >
        Modifier
      </button>

      <ng-container *ngIf="editMode">
        <button
          (click)="cancelEdit()"
          class="flex-1 border border-stone-300 rounded-lg py-2.5 text-stone-600 hover:bg-stone-50"
        >
          Annuler
        </button>
        <button
          (click)="save()"
          [disabled]="isSaving"
          class="flex-1 bg-slate-800 hover:bg-slate-700 text-stone-100 rounded-lg py-2.5 disabled:opacity-50"
        >
          {{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </ng-container>
    </div>
  </div>
</div>
