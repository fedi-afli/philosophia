<div class="min-h-screen flex items-center justify-center bg-stone-300">
  <div class="bg-white rounded-xl shadow-lg p-10 w-full max-w-sm border border-stone-200">
    <h1 class="text-2xl font-serif text-stone-800 text-center mb-1">Sophia</h1>
    <p class="text-xs text-stone-500 text-center uppercase tracking-widest mb-8">Connexion</p>

    <form (ngSubmit)="submit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-stone-700 mb-1">Nom d'utilisateur</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-700"
        />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-stone-700 mb-1">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full border border-stone-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-700"
        />
      </div>

      <p *ngIf="errorMessage" class="text-sm text-red-700 mb-4">{{ errorMessage }}</p>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-stone-100 font-medium py-3 rounded-lg transition-colors"
      >
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
